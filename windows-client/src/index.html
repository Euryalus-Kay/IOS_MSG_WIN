<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMessage</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <!-- Connection Setup Screen -->
  <div id="setup-screen" class="setup-screen">
    <div class="setup-card">
      <div class="setup-icon">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
          <rect width="72" height="72" rx="16" fill="url(#iconGrad)"/>
          <path d="M36 18C25.5 18 17 25.1 17 33.6C17 38.4 19.6 42.7 23.6 45.5L21.5 53.5L30 49C31.8 49.4 33.8 49.6 36 49.6C46.5 49.6 55 42.5 55 34C55 25.1 46.5 18 36 18Z" fill="white"/>
          <defs>
            <linearGradient id="iconGrad" x1="0" y1="0" x2="72" y2="72">
              <stop offset="0%" stop-color="#30D158"/>
              <stop offset="100%" stop-color="#34C759"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>iMessage for Windows</h1>
      <p class="setup-subtitle">Connect to your Mac to access your messages, contacts, and group chats</p>

      <div class="setup-form">
        <label>Server Address</label>
        <input type="text" id="server-url-input" placeholder="http://192.168.1.xxx:3782" spellcheck="false" autocomplete="off">
        <p class="setup-hint">Start the server on your Mac first, then enter the address shown in the terminal</p>
        <button id="connect-btn" class="btn-primary">
          <span id="connect-btn-text">Connect</span>
        </button>
        <p id="connection-error" class="error-text" style="display:none"></p>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="main-app" class="main-app" style="display:none">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="drag-region"></div>
        <div class="sidebar-title">
          <h2>Messages</h2>
          <div class="sidebar-actions">
            <button id="settings-btn" class="icon-btn" title="Settings">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m-7.07-3.93l2.83-2.83m8.48-8.48l2.83-2.83M1 12h4m14 0h4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="search-bar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search messages">
        </div>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <!-- No conversation selected -->
      <div id="no-chat" class="no-chat">
        <div class="no-chat-icon">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
            <path d="M28 6C15.3 6 5 14.9 5 25.8C5 32.1 8.3 37.7 13.5 41.3L11 50L21 45.5C23.2 46.1 25.5 46.4 28 46.4C40.7 46.4 51 37.5 51 26.6C51 14.9 40.7 6 28 6Z" fill="currentColor" opacity="0.15"/>
          </svg>
        </div>
        <p>Select a conversation</p>
      </div>

      <!-- Active chat -->
      <div id="active-chat" class="active-chat" style="display:none">
        <div class="chat-header">
          <div class="chat-header-info" id="chat-header-info-click">
            <div class="chat-avatar" id="chat-avatar">
              <span id="chat-avatar-text"></span>
            </div>
            <div class="chat-header-text">
              <h3 id="chat-name"></h3>
              <p id="chat-subtitle" class="chat-subtitle"></p>
            </div>
          </div>
          <div class="chat-header-actions">
            <button id="chat-info-btn" class="icon-btn" title="Details">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="messages-container" class="messages-container">
          <div id="messages-list" class="messages-list"></div>
        </div>

        <div class="message-input-area">
          <div class="message-input-wrapper">
            <textarea id="message-input" placeholder="iMessage" rows="1"></textarea>
            <button id="send-btn" class="send-btn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Info Panel -->
      <div id="info-panel" class="info-panel" style="display:none">
        <div class="info-panel-header">
          <button id="close-info-btn" class="icon-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <h3>Details</h3>
        </div>
        <div id="info-panel-content" class="info-panel-content"></div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal" style="display:none">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3>Settings</h3>
      <div class="settings-form">
        <label>Server Address</label>
        <input type="text" id="settings-server-url" spellcheck="false" autocomplete="off">
        <div class="settings-actions">
          <button id="settings-save" class="btn-primary">Save & Reconnect</button>
          <button id="settings-cancel" class="btn-secondary">Cancel</button>
        </div>
      </div>
      <div id="server-info" class="server-info"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
